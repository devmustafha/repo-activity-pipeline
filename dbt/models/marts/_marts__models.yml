version: 2

models:
  - name: mart_repo_activity_daily
    description: >
      Headline mart: engineering activity (commits, issue flow, PR flow,
      contributor counts) by repo x day.
    columns:
      - name: repo_full_name
        data_tests: [not_null]
      - name: activity_date
        data_tests: [not_null]
      - name: commits
        data_tests: [not_null]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [repo_full_name, activity_date]
